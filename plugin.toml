id = "io.github.yuanyeyoutao.kun-game"
name = "Kun Game"
version = "1.1.2"
description = "养鲲、对战、BOSS、拍卖与群小游戏的确定性游戏插件"
entrypoint = "plugin:KunGamePlugin"

plugin_api = "8.0"
yuki_requires = ">=4.0.0"

permissions = [
  "command.register",
  "message.current.read",
  "person.current.read",
  "storage.private",
  "plugin.config.read",
  "plugin.config.write",
]

[limits]
background_tasks = 0
http_concurrency = 1
storage_mb = 32
