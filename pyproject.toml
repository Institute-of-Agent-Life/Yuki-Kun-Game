[project]
name = "yuki-kun-game"
version = "1.1.1"
description = "Yuki Plugin API 7.0 养鲲游戏插件"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.7,<3"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "yuki @ https://github.com/YuanYeYouTao/Yuki/archive/ed1615e145daf75bcc002762a27e93f7ebfa818b.tar.gz",
    "pytest>=8.3,<9", "ruff>=0.8,<1", "tzdata>=2025.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
